<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suno 키워드 음악 활동</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="workspace" aria-labelledby="app-title">
      <div class="intro-panel">
        <div class="visual" aria-hidden="true">
          <div class="disc"><span></span></div>
          <div class="bars">
            <i></i><i></i><i></i><i></i><i></i>
          </div>
        </div>
        <div>
          <p class="eyebrow">Suno 음악 만들기 활동</p>
          <h1 id="app-title">키워드에서 노래 주제와 가사 초안까지</h1>
          <p class="lead">고등학생이 너무 넓은 주제 앞에서 멈추지 않도록, 무작위 키워드와 선택지를 조합해 바로 사용할 수 있는 음악 제작 프롬프트를 만듭니다.</p>
        </div>
      </div>

      <div class="tool-grid">
        <section class="generator-panel" aria-labelledby="keyword-heading">
          <div class="panel-header">
            <div>
              <p class="section-label">Step 1</p>
              <h2 id="keyword-heading">랜덤 키워드</h2>
            </div>
            <button id="drawButton" class="primary-button" type="button">키워드 뽑기</button>
          </div>

          <div class="keyword-stage" aria-live="polite">
            <p id="keywordCategory" class="keyword-category">수업을 시작해볼까요?</p>
            <p id="keywordText" class="keyword-text">키워드 대기 중</p>
            <p id="keywordHint" class="keyword-hint">버튼을 누르면 음악 주제에 어울리는 키워드가 나옵니다.</p>
          </div>

          <div class="controls" aria-label="노래 생성 조건">
            <label>
              장르
              <select id="genreSelect">
                <option>청량한 K-pop</option>
                <option>어쿠스틱 발라드</option>
                <option>힙합/R&B</option>
                <option>시티팝</option>
                <option>인디 록</option>
                <option>EDM 팝</option>
              </select>
            </label>
            <label>
              분위기
              <select id="moodSelect">
                <option>희망적이고 따뜻하게</option>
                <option>차분하고 사색적으로</option>
                <option>밝고 에너지 있게</option>
                <option>몽환적이고 영화처럼</option>
                <option>진지하고 담담하게</option>
              </select>
            </label>
            <label>
              관점
              <select id="voiceSelect">
                <option>고등학생 1인칭</option>
                <option>친구에게 말하듯</option>
                <option>미래의 내가 현재의 나에게</option>
                <option>우리 반이 함께 부르는 느낌</option>
              </select>
            </label>
          </div>
        </section>

        <section class="output-panel" aria-labelledby="prompt-heading">
          <div class="panel-header compact">
            <div>
              <p class="section-label">Step 2</p>
              <h2 id="prompt-heading">Suno 프롬프트</h2>
            </div>
            <button id="copyButton" class="icon-button" type="button" title="프롬프트 복사" aria-label="프롬프트 복사">복사</button>
          </div>
          <textarea id="promptOutput" readonly spellcheck="false"></textarea>
          <p id="copyStatus" class="copy-status" role="status"></p>
        </section>
      </div>

      <section class="lyrics-panel" aria-labelledby="lyrics-heading">
        <div class="panel-header compact">
          <div>
            <p class="section-label">Step 3</p>
            <h2 id="lyrics-heading">가사 초안</h2>
          </div>
          <button id="refreshLyrics" class="secondary-button" type="button">초안 다시 만들기</button>
        </div>
        <pre id="lyricsOutput"></pre>
      </section>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
